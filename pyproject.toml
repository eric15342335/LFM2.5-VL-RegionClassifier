[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["node_modules"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.isort]
profile = "black"
line_length = 100
skip = ["node_modules"]

[tool.pytest.ini_options]
pythonpath = ["."]

[project]
name = "lfm25-vl-region-classifier"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "isort>=8.0.1",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "ruff>=0.15.22",
    "uvicorn[standard]>=0.51.0",
]
