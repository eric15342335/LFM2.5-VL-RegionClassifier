[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "ASYNC", "C4", "PERF", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.isort]
profile = "black"
line_length = 100
skip = ["node_modules"]

[tool.pytest.ini_options]
pythonpath = ["."]
